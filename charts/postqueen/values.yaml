replicaCount: 1

image:
  repository: ghcr.io/gkhankinay/postqueen-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  additionalPorts: []

ingress:
  enabled: false  # Disabled by default
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          port: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  extraRules: []

resources: {}

extraContainers: []

extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  # Docker Hub no longer serves the bitnami/postgresql tag this subchart pins.
  # The same tag is still published under bitnamilegacy/.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r7
  auth:
    username: postqueen
    password: postqueen-password
    database: postqueen
  service:
    ports:
      postgresql: 5432

# Redis configuration
redis:
  enabled: true
  # Docker Hub no longer serves the bitnami/redis tag this subchart pins.
  # The same tag is still published under bitnamilegacy/.
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.0-debian-12-r2
  auth:
    password: postqueen-redis-password
  master:
    service:
      ports:
        redis: 6379

# Environment variables
#
# The published image is all-in-one: nginx on container port 5000 (Service 80)
# fronts Next.js and NestJS in the same pod. There is no `backend` Service.
# FRONTEND_URL and NEXT_PUBLIC_BACKEND_URL are public origins — leave them
# empty until you expose the release, then set them to that HTTPS host
# (NEXT_PUBLIC_BACKEND_URL keeps the `/api` suffix). BACKEND_INTERNAL_URL is
# server-to-server inside the container (NestJS still listens on 3000); do not
# point it at the chart Service or a public domain.
env:
  FRONTEND_URL: ""
  NEXT_PUBLIC_BACKEND_URL: ""
  BACKEND_INTERNAL_URL: "http://localhost:3000"
  UPLOAD_DIRECTORY: ""
  NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: ""
  NX_ADD_PLUGINS: "false"
  IS_GENERAL: "true"
  # Temporal powers scheduling and publishing. This chart does NOT bundle a
  # Temporal server — point this at your own (host:port). Left unset, the app
  # falls back to localhost:7233, which does not work inside Kubernetes.
  TEMPORAL_ADDRESS: ""
  TEMPORAL_NAMESPACE: "default"

# Sensitive environment variables (to be stored in Secrets)
secrets:
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""
  X_API_KEY: ""
  X_API_SECRET: ""
  LINKEDIN_CLIENT_ID: ""
  LINKEDIN_CLIENT_SECRET: ""
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  RESEND_API_KEY: ""
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_ACCESS_KEY: ""
  CLOUDFLARE_SECRET_ACCESS_KEY: ""
  CLOUDFLARE_BUCKETNAME: ""
  CLOUDFLARE_BUCKET_URL: ""
