replicaCount: 1

image:
  repository: ghcr.io/gkhankinay/postqueen-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  additionalPorts: []

ingress:
  enabled: false  # Disabled by default
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          port: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  extraRules: []

resources: {}

extraContainers: []

extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  # Docker Hub no longer serves the bitnami/postgresql tag this subchart pins.
  # The same tag is still published under bitnamilegacy/.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r7
  auth:
    username: postqueen
    password: postqueen-password
    database: postqueen
  service:
    ports:
      postgresql: 5432

# Redis configuration
redis:
  enabled: true
  # Docker Hub no longer serves the bitnami/redis tag this subchart pins.
  # The same tag is still published under bitnamilegacy/.
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.0-debian-12-r2
  auth:
    password: postqueen-redis-password
  master:
    service:
      ports:
        redis: 6379

# Environment variables
#
# The published image is all-in-one: nginx on container port 5000 (Service 80)
# fronts Next.js and NestJS in the same pod. There is no `backend` Service.
# FRONTEND_URL and NEXT_PUBLIC_BACKEND_URL are public origins — leave them
# empty until you expose the release, then set them to that HTTPS host
# (NEXT_PUBLIC_BACKEND_URL keeps the `/api` suffix). BACKEND_INTERNAL_URL is
# server-to-server inside the container (NestJS still listens on 3000); do not
# point it at the chart Service or a public domain.
env:
  FRONTEND_URL: ""
  NEXT_PUBLIC_BACKEND_URL: ""
  BACKEND_INTERNAL_URL: "http://localhost:3000"
  # Local storage on the uploads volume, the same defaults as the Docker
  # Compose stack. For Cloudflare R2 set STORAGE_PROVIDER to "cloudflare" and
  # the CLOUDFLARE_* values instead.
  STORAGE_PROVIDER: "local"
  UPLOAD_DIRECTORY: "/uploads"
  NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: "uploads"
  NX_ADD_PLUGINS: "false"
  IS_GENERAL: "true"
  # Temporal powers scheduling and publishing. This chart does NOT bundle a
  # Temporal server — point this at your own (host:port). Left unset, the app
  # falls back to localhost:7233, which does not work inside Kubernetes.
  TEMPORAL_ADDRESS: ""
  TEMPORAL_NAMESPACE: "default"
  # How the app applies its database schema each time it starts.
  #   ""     (default) `prisma db push`, as in every earlier chart version.
  #   "true" `prisma migrate deploy`: an ordered, reviewable migration history,
  #          the same path PostQueen Cloud runs. Recommended for new installs.
  # An existing database that was built by db push must be baselined once
  # before you set "true", or the pod stops at start with error P3005. See
  # "Switching to migrations" in the README.
  PRISMA_MIGRATE: ""
  # Channel OAuth tokens are stored encrypted with ENCRYPTION_KEY (app default,
  # since v3.6.102). Set "false" only for the one start that decrypts them
  # before you roll the image back below v3.6.102; see the README.
  ENCRYPT_INTEGRATION_TOKENS: "true"

# Sensitive environment variables (to be stored in Secrets)
secrets:
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET: ""
  # Encryption at rest for channel tokens and other stored credentials. These
  # two are left commented on purpose: an empty value here would override one
  # you set under `env`. Add them to your own values file.
  #   ENCRYPTION_KEY: a long random value, different from JWT_SECRET. Falls
  #     back to JWT_SECRET when unset. Losing it disconnects every channel.
  #   PREVIOUS_ENCRYPTION_KEY: the old key after you change ENCRYPTION_KEY (or
  #     JWT_SECRET on an install that never set ENCRYPTION_KEY). Keep it set.
  # ENCRYPTION_KEY: ""
  # PREVIOUS_ENCRYPTION_KEY: ""
  X_API_KEY: ""
  X_API_SECRET: ""
  LINKEDIN_CLIENT_ID: ""
  LINKEDIN_CLIENT_SECRET: ""
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  RESEND_API_KEY: ""
  CLOUDFLARE_ACCOUNT_ID: ""
  CLOUDFLARE_ACCESS_KEY: ""
  CLOUDFLARE_SECRET_ACCESS_KEY: ""
  CLOUDFLARE_BUCKETNAME: ""
  CLOUDFLARE_BUCKET_URL: ""
